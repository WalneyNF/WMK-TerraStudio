name: WMK Planet Watch - Testes
on:
  workflow_dispatch:
  push:
    paths: ['modulos/planet-watch/**', '.github/workflows/wmk-planet-watch.yml']
  pull_request:
    paths: ['modulos/planet-watch/**', '.github/workflows/wmk-planet-watch.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Testes locais sem internet
        working-directory: modulos/planet-watch
        run: python -m unittest discover -s tests -v
