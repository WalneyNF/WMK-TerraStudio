name: WMK Virtual Journey - Testes
on:
  pull_request:
    paths: ['modulos/virtual-journey/**', '.github/workflows/wmk-virtual-journey.yml']
  push:
    paths: ['modulos/virtual-journey/**', '.github/workflows/wmk-virtual-journey.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Testar endpoint ADS-B sem rede
        working-directory: modulos/virtual-journey
        run: |
          php -l api/flights_lib.php
          php -l api/flights.php
          php tests/flights.php
      - name: Testar física demonstrativa e biblioteca de modelos
        working-directory: modulos/virtual-journey
        run: npm test
